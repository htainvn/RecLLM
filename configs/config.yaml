model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna  # legacy key — `_init_llm_model` uses AutoModel, any HF causal LM works.
  llm_model: "/content/SigLLM/ckpt/llm/qwen2-7b-base"
  prompt_path: "/content/SigLLM/prompts/qformer_prompt_movie.txt"
  # Qwen2-7B-Base is NOT instruction-tuned, so the Vicuna USER/ASSISTANT
  # chat wrapping is dropped. A trailing `Answer:` cue is appended so the
  # base model continues with the "Yes" / "No" label as plain completion.
  prompt_template: '{} Answer:'
  
  freeze_rec: True
  freeze_proj: False

  # SeLLa-style DIRECT ID path, parallel to the Q-Former: <UserID> and <ItemID>
  # inject MLP(e_u) / MLP(e_i) as ONE soft token each, so the LLM sees both raw
  # CF vectors and can in principle reconstruct the MF dot product e_u . e_i
  # (lower-bounds the model at the MF baseline). The MLPs (d_cf->1024->GELU->H)
  # warm-start from the MF checkpoint's trans_1/trans_2 when the MF was trained
  # with the Step-2 semantic alignment (run.rec_baseline.item_llm_emb_path) —
  # SeLLa's pretrained_with_small=True. Needs a prompt that carries the
  # <UserID>/<ItemID> placeholders (qformer_prompt_movie_direct_id.txt); with a
  # prompt that lacks them this only costs two unused projections.
  direct_id_tokens: True

  # Stage 3 ablation switch. When True, target_llm and interacted_llm_flat
  # are zeroed right after llm_proj, so every soft-token slot in the prompt
  # carries a zero vector instead of the projected Q-Former output. Use this
  # to measure the marginal contribution of soft tokens at inference: load a
  # trained checkpoint, flip this to True, re-evaluate. If AUC barely drops,
  # the Q-Former isn't contributing — the LLM is leaning on prompt text alone.
  ablate_soft_tokens: False

  # CoLLM-style 2-step tuning. Each Stage 3 pipeline script overrides this
  # from its own `run.qformer_stage3_step{1,2}` block (see
  # `apply_step{1,2}_overrides` in the two scripts). Leave null at top level —
  # the model only enforces a step policy when this is explicitly 1 or 2.
  tuning_step: null

  lora_config:
    use_lora: True
    # Reverted to r=8 [q,v] after A ablation: r=16 [q,k,v,o] (10M trainable
    # LoRA) overfit on 33k ML1M samples — val uAUC peaked at 0.7048 vs r=8
    # baseline 0.7077, with train loss dropping ~2x faster than r=8.
    # Conclusion: LoRA capacity is NOT the bottleneck; Q-Former Stage 1
    # quality is (now addressed by 8 layers + user-item contrastive).
    r: 8
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    dropout: 0.05

  max_txt_len: 1024
  end_sym: "###"
  ans_type: "v2"

  # uAUC-aligned objective for Stage 3. L = BCE + weight * per-user pairwise BPR
  # (a differentiable AUC surrogate over the Yes/No margin). weight=0.0 -> the
  # original pointwise BCE. Requires run.user_grouped_batch so batches contain
  # same-user pos/neg pairs, otherwise the term has no pairs to act on.
  # ON: the eval metric is uAUC but pointwise BCE never asks for within-user
  # ordering — nothing in the objective rewarded the soft tokens for carrying
  # per-candidate signal. 0.5 keeps BCE primary (both terms start ~ln 2);
  # tune 0.3–1.0.
  ranking_loss:
    weight: 0.5
    tau: 1.0

  # Rank-preserving collaborative-ALIGNMENT loss. Unlike ranking_loss (which
  # shapes the LLM's Yes/No output margin), this reads a scalar off the ALIGNED
  # CF soft tokens (pre-LLM, the user-conditioned Q-Former output) and imposes a
  # per-user BPR on THEM, so the collaborative alignment itself preserves
  # within-user ordering. This directly attacks the user-conditioned failure
  # mode: the additive per-user shift cancels in uAUC but adds cross-user AUC
  # noise; this loss makes the shift earn within-user discrimination instead.
  # Gated to Step 2 (where Q-Former/proj are trainable). weight=0.0 -> disabled.
  # ON (small): makes the ALIGNED soft tokens themselves — not just the LLM's
  # Yes/No margin — preserve within-user ordering, so the channel carries
  # per-candidate signal even where the frozen LLM under-attends it.
  align_rank_loss:
    weight: 0.1
    tau: 1.0

  proj_token_num: ${model.qformer_config.num_queries}

  rec_model: "MF"
  user_num: -100
  item_num: -100

  qformer_config:
    use_qformer: True
    qformer_ckpt: "${run.qformer_stage2.output_dir}${run.qformer_stage2.qformer_ckpt_out}" # Q-Former weights after Stage 2 generative pretraining
    llm_proj_ckpt: "${run.qformer_stage2.output_dir}${run.qformer_stage2.proj_ckpt_out}" # Projection weights after Stage 2 generative pretraining
    qformer_d_model: 768
    qformer_output_dim: 768 # Keep Q-Former compact; llm_proj maps this to the LLM hidden size.
    qformer_text_model_name: "bert-base-uncased"
    max_instruction_length: 48
    num_queries: 8
    num_heads: 8
    num_layers: 4
    user_conditioned: True
    # Disabled for the clean attribution run: isolates the Q-Former→LLM
    # alignment (w_align) as the contribution and removes the warm-token
    # distill dependency (item_llm_emb.pt from the fine-tuned LLM). The
    # prompt's <Warm_ID> is stripped when False (wrap_prompt_with_soft_tokens_v2).
    warm_token: False
    item_llm_emb_path: "/content/SigLLM/data/processed/ml-1m/item_llm_emb.pt"
    # Second cross-attention source: the same LAST-HIDDEN semantic bank Stage
    # 1/2 trained proj_sem on, fed next to the CF vector so attention balances
    # CF vs semantics per item. Cold items (weak CF, rich text) lean on
    # semantics; items with no text have zero rows and are masked back to
    # CF-only. MUST stay a different file from the Stage-1 L_llm target bank
    # (run.qformer_stage1.item_llm_emb_path, input-space): feeding the target
    # as a source lets the model copy it through proj_sem and turns L_llm into
    # a leak — Stage 1 hard-errors on that combination.
    sem_source: True
    item_sem_emb_path: ${run.qformer_stage1.item_sem_emb_path}
    # Training-time row dropout on the semantic source so the CF path keeps
    # earning gradient (semantics is the easier shortcut for warm items).
    # 0.2, not 0.5: at 0.5 half of every batch contributed nothing to proj_sem,
    # and since proj_sem is zero-initialised it needs gradient to leave 0 at all
    # — it stayed inert. 0.2 keeps the CF path honest while giving the semantic
    # channel 4x more signal. NOTE: dropout is NOT the only way this path dies —
    # if the bank has all-zero rows for the items in play they are masked out
    # entirely; Stage 1 now logs covered_rows for exactly that reason.
    sem_source_dropout: 0.2
    # Candidate-aware MULTIPLICATIVE interaction in the cross-attention MEMORY
    # (vs user_conditioned, which shifts the QUERIES additively). Two parts:
    # (1) each history slot j becomes m_j = proj_cf(e_j) +
    #     fuse_cf([e_t; e_j*e_t; e_j - e_t]) — the e_j*e_t block's coordinate
    #     sum IS the MF dot product, so the Q-Former reads the collaborative
    #     match between the candidate and every history item (DIN-style
    #     target attention by multiplication, not addition);
    # (2) ONE extra SELECTABLE memory slot fuse_user([e_u; e_u*e_t; e_u-e_t])
    #     appended to BOTH the history and the target encodes. A slot, not a
    #     broadcast: adding the same vector to every key/value cancels in
    #     softmax and degenerates to an output bias — the additive shift the
    #     ablations already showed doesn't move uAUC. On the target encode
    #     this slot also ends the S=1 degeneracy (when sem_source is off) and
    #     makes the 8 <TargetItemID> tokens user-aware.
    # Warm-start safety: fuse_cf is zero-init (exact no-op). The user slot is
    # initialised as a COPY of the target slot (proj_cf(e_t) + zero-init
    # fuse_user residual) — duplicating a slot with identical key/value keeps
    # the attention output EXACTLY unchanged on the S=1 target path (a
    # zero-init slot there would grab a large share of the mass via the key
    # bias and wreck the Stage-1/2 alignment); with sem on it double-counts
    # the CF slot (mild), and on the history path it adds the candidate as
    # one phantom slot among L (~1/(L+1) mass).
    candidate_fusion: True

  # ===================================================================
  # SeLLa-gated variant — read ONLY by arch: sella_gated_rec_llm
  # (src/sigllm/models/multimodal/sella_gated_rec_llm.py, driven by
  #  pipelines/multimodal/train_sella_gated_step3.py). Every key above that the
  #  variant does not read is simply ignored, so QRecLLM's settings are
  #  untouched and both models can live in one config.
  #
  # The difference in one line: instead of 2*num_queries NEW soft-token
  # positions (<UserProfile> + <TargetItemID>), the Q-Former is a GATED ADDITION
  # onto SeLLa's existing <UserID> token:
  #     e_user <- id_proj(e_u) + g * qformer(user, target, history)
  # with g a single scalar, zero-initialised. At g = 0 the model is SeLLa
  # numerically — the term is a literal + 0 — so the run cannot start worse, and
  # g after training IS the measured contribution (logged as qformer/gate plus
  # the scale-free delta_rel = ||g*delta||/||e_user||).
  # ===================================================================
  sella_gated:
    use_qformer: True

    # Trimmed against model.qformer_config above (768 / 4 layers / CAF 2 /
    # 8 queries / ~76M with the BERT text branch):
    #   - text branch REMOVED entirely. The instruction list of this task is
    #     near-constant, so a text stream carries no per-sample signal while
    #     costing ~72M parameters and a bert-base download.
    #   - cross_attention_frequency is fixed at 1 (not configurable): with only
    #     2 layers, every layer INCLUDING the last must be refreshed from
    #     memory, otherwise trimming depth starves the readout.
    d_model: 256
    num_layers: 2
    num_queries: 2      # 1 works too; both are pooled by mean into ONE vector
    num_heads: 4        # 256/4 = 64 dims per head, BERT-base's ratio
    dropout: 0.0

    # Cross-attention memory, 2L+1 slots for a history of length L:
    #   L   CF slots            proj_cf(e_j)
    #   L   semantic slots      proj_sem(LayerNorm(s_j))   <- use_sem
    #   1   user x target slot  fuse_user([e_u; e_u*e_t; e_u-e_t])  <- use_user_slot
    # The e_u*e_t block is why the interaction slot exists: its coordinate sum IS
    # the MF dot product, so attention can read the collaborative match between
    # this user and this candidate. It must be a SLOT, not a delta broadcast over
    # the other keys — a broadcast shifts every attention logit equally (softmax
    # unchanged) and adds a slot-independent constant, i.e. it degenerates into a
    # plain output bias.
    use_sem: True
    use_user_slot: True

    # Per-slot candidate fusion: m_j += fuse_hist([e_t; e_j*e_t; e_j-e_t]).
    # OFF by default because candidate-dependence already enters through the
    # query residual (each query is shifted by target_proj(e_t), so the same
    # history pools differently per candidate). This is the first thing to switch
    # on if the gate grows but uAUC does not.
    hist_target_fusion: False

    # Semantic-slot source. Left null it falls back to
    # model.qformer_config.item_llm_emb_path. The preferred source is actually
    # neither file but the MF's live, TRAINED item_embedding_llm table (present
    # whenever rec_config.item_llm_emb_path is set) — SeLLa trains that table, so
    # reading the raw bank instead would discard the Step-2 alignment.
    item_llm_emb_path: null

    # <Warm_ID> must stay ON for SeLLa parity: SeLLa injects all three tokens.
    # (model.qformer_config.warm_token above is False for QRecLLM's own runs;
    # that key is not read here.)
    warm_token: True

    # SeLLa freezes LoRA at step 3 — step 1 already adapted the LLM to the task,
    # and this stage trains the collaborative side against it. true makes LoRA
    # joint, which is a different (and less controlled) experiment.
    lora_trainable: False

    # Training objective. SeLLa: LM cross-entropy over the WHOLE sequence, with
    # the Yes/No softmax extracted only at eval.
    #   full          SeLLa exactly — every non-pad position supervised,
    #                 including the soft-token positions (SeLLa's target_ids are
    #                 input_ids with only padding masked).
    #   full_no_soft  the same, minus the soft-token positions. Worth trying:
    #                 SeLLa's three slots hold three DISTINCT special ids, but
    #                 here all three share one reserved id, so `full` spends
    #                 gradient on "emit the placeholder".
    #   answer        only the Yes/No token. Cheapest by far (see the batch-size
    #                 note in run.sella_gated_step3) and closest to the 2-way CE
    #                 that QRecLLM used.
    lm_loss_scope: full

    # How often (training steps) to log gate + delta_rel. 0 disables.
    gate_log_steps: 50

    # Inference-time ablation: zero the gated term without touching the gate, so
    # a trained checkpoint can be scored with and without the contribution.
    ablate_qformer: False

  rec_config:
    user_num: 839
    item_num: 3256
    embedding_size: 256
    pretrained_path: "/content/SigLLM/ckpt/mf/mf_model.pth"
    # Build the Stage-3 MF WITH the SeLLa Step-2 alignment modules so the
    # TRAINED item_embedding_llm / trans_1 / trans_2 from the MF checkpoint
    # load instead of being dropped by the variant-reconciling
    # load_state_dict. <Warm_ID> then reads the trained table (live module,
    # trainable under freeze_rec=False) instead of the raw distilled bank.
    # The bank file is only used to SHAPE the init before the checkpoint
    # overwrites it. Set null to build a plain 2-table MF.
    item_llm_emb_path: ${model.qformer_config.item_llm_emb_path}
    align_hidden_size: 1024
    align_tau: 0.2

  # Warm-init checkpoint. Step 2 overrides this with the Step 1 LoRA ckpt;
  # Step 1 overrides it to null. Leave null at top level so a bare config
  # build (e.g. an ablation run) does not silently load a warm-init.
  ckpt: null

datasets:
  movie_ood:
    path: "/content/SigLLM/data/processed/ml-1m/"
    data_type: default
    min_positive_history: 2
    warm_definition: "not_cold"
    # SHARED history cap. Read by BOTH MovieOODDataset (Stage 3 prompts /
    # <UserProfile> pooling) and build_qformer_dataset (Stage 1 user_item
    # "his" truncation), so the Q-Former pretrains its history pooling on
    # exactly the sequence length Stage 3 feeds it. Changing this requires
    # rebuilding the qformer pkls.
    #
    # 10 — which is SeLLa's OWN cap, not just a cheap setting. SeLLa
    # `codes/step3_train_sella/prepare_finetune_data.py` uses max_len=10 for the
    # title list and pads/truncates `his` to max_length=10. So on the
    # SeLLa-gated branch (arch: sella_gated_rec_llm) this value is part of the
    # parity claim, and raising it is a deliberate departure from SeLLa rather
    # than a free improvement.
    #
    # Measured on the raw ml-1m split after the min_positive_history=2 filter
    # (real items, padding excluded): median real history is 24 on train, 38 on
    # valid, 42 on test; p90 = 97 / 138 / 192; mean 39 / 58 / 76.
    #
    # Coverage (fraction of rows whose FULL history fits) and mean items kept.
    # The 10/40/50/80/100 coverage rows were re-measured and reproduce the
    # original table exactly; 20 and 30 were added by the same script.
    #     cap  train  valid   test | mean kept tr/va/te | tok max  slack
    #  -> 10   28.1%  16.0%  13.1% |   8.6   9.3    9.5 |      86    938
    #     20   45.3%  30.9%  25.7% |  15.0  17.0   17.6 |    ~197    ~830
    #     30   57.0%  43.1%  38.1% |  19.9  23.3   24.5 |    ~274    ~750
    #     40   66.1%  52.3%  48.6% |  23.7  28.6   30.2 |     280    744
    #     50   72.6%  59.5%  57.1% |  26.8  33.0   34.9 |     332    692
    #     80   85.7%  76.1%  69.5% |  32.9  42.6   45.6 |     495    529
    #    100   90.7%  82.8%  74.2% |  35.3  46.7   51.2 |     618    406
    #
    # Read the low coverage honestly: at 10, 72% of train rows and 87% of test
    # rows are truncated, so a flat uAUC does NOT show "history does not help" —
    # it shows "the most recent 10 items do not help". Testing that properly
    # means raising the cap, which on the gated branch also costs memory (below).
    #
    # Cost on the gated branch is dominated by the PROMPT, not the history
    # tensor: that branch trains with FULL-VOCABULARY LM cross-entropy over the
    # whole sequence, so its largest term scales with prompt length x 151936.
    # ~86 tokens at cap 10 vs ~332 at cap 50 is nearly a 4x difference in it.
    #
    # Prompt budget is NOT the binding constraint at any of these: on the gated
    # branch the collaborative signal is 3 soft tokens regardless of history
    # length (and on nhánh A, <UserProfile> is 8 POOLED tokens regardless), so
    # only the <ItemTitleList> text grows, and even cap 100 leaves ~406 of
    # max_txt_len=1024 free. The headroom matters because the tokenizer
    # truncates on the RIGHT — an overflow deletes <TargetItemTitle> and the
    # "Answer:" cue outright rather than degrading gracefully. On the gated
    # branch that failure is caught loudly instead of silently: losing a
    # placeholder makes the soft-token slot count wrong and
    # _build_prompt_inputs raises.
    #
    # REBUILD CAVEAT. This key is read in two places at two different times:
    #   - MovieOODDataset reads it at LOAD time -> the Stage-3 prompts (both
    #     branches) pick the new value up immediately, no rebuild needed;
    #   - build_qformer_dataset reads it at BUILD time and the builder bakes the
    #     truncation into *_qformer_ood2.pkl, which qformer_alignment_dataset
    #     then passes through WITHOUT re-truncating.
    # So the already-built qformer pkls still carry 50-item histories. That is
    # harmless for the SeLLa-gated branch, which never runs Stage 1/2 and never
    # reads those pkls. If you go back to nhánh A, rerun
    # `python src/sigllm/pipelines/multimodal/build_qformer_dataset.py
    #  --cfg-path configs/config.yaml` first, or Stage 1 pretrains the history
    # pooling on length 50 while Stage 3 feeds it 40.
    max_history_length: 10
    build_info:
      storage: "/content/SigLLM/data/processed/ml-1m/"

run:
  task: rec_pretrain
  # Pipeline scripts override this from `run.qformer_stage3_step{1,2}`.
  output_dir: "ckpt/qformer_stage3_default"
  device: "cuda"
  seed: 42
  rec_baseline:
    save_file: ${model.rec_config.pretrained_path}
    need_train: True
    warm_or_cold: "warm"
    seed: 2025
    lr: 1e-3
    wd: 1e-4
    embedding_size: ${model.rec_config.embedding_size}
    epoch: 5000
    eval_epoch: 1
    patience: 100
    batch_size: 1024
    # SeLLa Step 2 (semantic-aligned collaborative training). When set, MF
    # trains with loss = BCE + align_weight * InfoNCE(tau=align_tau) between a
    # TRAINABLE item_embedding_llm table (init from this bank) and
    # trans_2(GELU(trans_1(e_item))) — pulling the CF item space toward the
    # LLM semantic space BEFORE the Q-Former compresses it (256-d -> 8 tokens
    # loses less when the two spaces are already congruent). The saved
    # checkpoint then also carries trans_1/trans_2, which warm-start the
    # Stage-3 direct-ID projections (model.direct_id_tokens). Uses the
    # LAST-HIDDEN bank — same file as the warm token, dims must equal the LLM
    # hidden size for the trans warm-start to apply. null = plain MF (BCE only).
    #
    # BOOTSTRAP ORDER (the bank is produced by distill_item_llm_embeddings.py,
    # so on a fresh setup distill BEFORE training this MF — the distill script
    # no longer needs mf_model.pth on any of its paths):
    #   base-LLM bank:   distill (base LLM) -> MF(align) -> stages.
    #   SeLLa parity     plain MF (item_llm_emb_path=null) -> step-1 LoRA ->
    #   (bank from the   distill (--rec-ckpt / --lora-adapter-dir) ->
    #   finetuned LLM):  re-train MF with alignment -> rerun stages.
    item_llm_emb_path: ${model.qformer_config.item_llm_emb_path}
    align_weight: 1.0
    align_tau: 0.2
    align_hidden_size: 1024
  qformer_stage1:
    # BLIP-2 representation pretraining: ITC + ITM + ITG using the Q-Former's
    # own text branch (no external BERT). Item-item contrastive (w_ii) is a
    # SigLLM-specific addition for co-watch collaborative signal.
    seed: 2025
    # 1024, not 256. The three item_text objectives share one in-batch negative
    # pool, and item_text is only ~5.9% of the flat sample list (item_item ~59%,
    # user_item ~35%), so batch_size=256 gave n_item_text=15. At 15 candidates
    # ITC saturates (@1 hit 0.79), ITM has almost no genuinely hard negative to
    # mine from its 15x15 similarity matrix and sat at its trivial 2/3 baseline,
    # and L_llm had 15 targets to separate and still stalled. 1024 puts
    # n_item_text ~60 without touching the pkl composition (that would need a
    # build_qformer_dataset rerun). Drop back to 256 if the item_item forward
    # (~600 pairs/batch through encode_cf) does not fit the GPU.
    batch_size: 1024
    num_workers: 4
    embedding_size: ${model.rec_config.embedding_size}
    user_num: ${model.rec_config.user_num}
    item_num: ${model.rec_config.item_num}
    num_queries: ${model.qformer_config.num_queries}
    num_heads: ${model.qformer_config.num_heads}
    num_layers: ${model.qformer_config.num_layers}
    qformer_d_model: ${model.qformer_config.qformer_d_model}
    qformer_output_dim: ${model.qformer_config.qformer_output_dim}
    qformer_text_model_name: ${model.qformer_config.qformer_text_model_name}
    max_instruction_length: ${model.qformer_config.max_instruction_length}
    item_pair_window: 2
    max_item_item_pairs: null
    max_user_item_pairs: null
    include_user_item: True
    # Item-level holdout for the item_text objective (build_qformer_dataset).
    # An item's (CF, text) pair lands in exactly ONE split's item_text block,
    # assigned by a deterministic hash of (item_text_split_seed, iid). Without
    # this, every split carried item_text for all of its items, and since the
    # interaction split is temporal, val items are almost all seen in train —
    # val ITC/ITM/ITG measured memorization, not generalization (why the text
    # terms kept "improving" while L_ii/L_ui drifted). Requires rebuilding the
    # qformer pkls. Set both to 0.0 for the legacy all-items behaviour.
    item_text_valid_frac: 0.1
    item_text_test_frac: 0.1
    item_text_split_seed: 42
    # Fixed-n item_text diagnostic. The main loaders mix sample types, so
    # n_item_text per batch depends on split composition and in-batch chance
    # (1/n) differs between train and val — val ITC@1 then looks better than
    # train for free, ITM parks at its trivial 2/3 baseline for lack of hard
    # negatives, and L_llm is capped at ln(n) below the train figure. This runs
    # an extra measurement-only pass over the item_text rows ALONE, with
    # drop_last so EVERY batch holds exactly this many rows on every split —
    # that is what makes n (and chance) identical across train/val/test.
    # Because the tail is dropped, this must be <= the SMALLEST held-out
    # item_text block (~10% of the catalog per eval split); a split with fewer
    # rows than one batch yields no batches and is skipped with a warning.
    item_text_eval_batch_size: 205
    # Same pass is repeated with the semantic cross-attention source FORCED OFF
    # (the sem_dropout gate is train-only, so ordinary eval runs it at full
    # strength). sem_on vs sem_off separates "the CF path learned this" from
    # "the semantic source carried it" — necessary because that source is
    # another projection of the very captions ITC/ITG/L_llm target. 0 disables
    # all diagnostics.
    diagnostic_every_epochs: 1
    # Fixed permutation for val/test so their batches carry the same
    # sample-type mix as shuffled train batches. Without it the builder's
    # contiguous per-type blocks give eval batches ~250 item_text rows vs
    # train's ~15, and since in-batch contrastive chance is 1/n, train and val
    # retrieval numbers differ ~17x for purely mechanical reasons. Set to null
    # to restore the old block ordering.
    eval_permute_seed: 0
    # sqrt-scaled with the 4x batch_size bump (5e-5 -> 1e-4). Steps per epoch
    # drop 4x, so if L_repr now improves too slowly per epoch, raise `epoch`
    # rather than pushing lr further.
    lr: 1e-4
    # 0.3, down from 1.0. ITC cannot generalise from CF alone (its target is the
    # caption's text CLS, dominated by the per-item TITLE, which MF embeddings
    # do not carry — see the selection_metric note below), so at full weight its
    # gradient mostly drives memorisation of train-item signatures: measured
    # train g_itc +0.33 -> +4.54 over 5 epochs while val went +0.16 -> -0.84.
    # Kept non-zero rather than removed: it is still the only term pressuring
    # the queries to be input-dependent at all, and the terms that DO generalise
    # (g_llm, g_ii, g_ui) all kept improving alongside it, so it is not actively
    # harmful — just over-weighted. Watch offdiag_cos_centered: if it shrinks
    # toward 0 as fast as before, memorisation still dominates and this can go
    # lower; if it stops shrinking, 0.3 is doing its job.
    w_itc: 0.3
    # 0.0 — OFF. ITM_acc has sat at exactly 0.6667 on every epoch and every
    # split across runs, i.e. its trivial baseline (label mix is 1 positive :
    # 2 negatives, so predicting all-negative scores 2/3). L_itm likewise never
    # left ~0.637. Raising n_item_text to 205+ per batch did not help, so the
    # hard-negative mining is not negative-starved — the head simply is not
    # learning. A term stuck at its baseline contributes only gradient noise to
    # the shared Q-Former body, and it was previously also distorting the
    # L_repr selection metric. Re-enable (start ~0.2) only with a concrete
    # hypothesis for why it would behave differently.
    w_itm: 0.0
    # 1.0 — do NOT lower this, even though ITG overfits on the title exactly like
    # ITC (train ITG_title 0.258 -> 0.794 while val peaks at 0.371 and val L_itg
    # rises monotonically). It was tried at 0.3 and the collaborative terms
    # STOPPED LEARNING ENTIRELY: val g_ii froze at +0.124 and g_ui at +0.110,
    # identical to 4 decimals for 10 straight epochs, with proj_sem stalled near
    # 1.0 instead of climbing past 4.
    #
    # Mechanism: ITC and ITG are the only terms that push the query output to be
    # input-dependent. With both damped, offdiag_cos_raw stayed at 0.9997 (vs
    # 0.9933 by ep10 at w_itg=1.0) — every item still encodes to the same
    # direction. L_ii / L_ui score cosines over pooled queries, so against a
    # collapsed representation they have nothing to discriminate and sit at
    # chance indefinitely. ITG's "overfitting" is the price of the anti-collapse
    # pressure that makes the collaborative terms work at all.
    #
    # w_itc=0.3 + w_itg=1.0 is the best known pair: ITC damped enough to stop
    # dominating, ITG left strong enough to keep the representation open.
    w_itg: 1.0
    w_ii: 1.0
    w_ui: 1.0
    # Candidate-conditioned pairwise BPR ADDED to the ui InfoNCE — the term
    # that pretrains user_proj (Stage 3's target-conditioned history pooling).
    # Scored on mean-pooled queries at a soft temperature: the first version
    # replaced the InfoNCE and scored via independent max-pair selection, which
    # pinned L_ui at ln(2) (both scores hit the same top-pair ceiling) while
    # its 1/tau-scale gradient noise degraded the shared body (g_itc fell
    # ~2.3 -> 0.65 nats on that run, together with the random proj_sem init).
    #
    # !! STALE A/B — RERUN BEFORE TRUSTING THESE SETTINGS !!
    # The four runs below ((a)-(d)) predate two structural changes that alter
    # exactly what this pretext trains:
    #   1. The user source was a single MF vector (S=1), so user_q_pos vs
    #      user_q_neg differed only by a user_proj shift on ONE key and the
    #      pretext was nearly vacuous — "roll + no distill" winning largely
    #      means "disturbs the body least". The source is now the padded
    #      history sequence (S=L), where conditioning genuinely changes which
    #      history items attention selects.
    #   2. user_proj is now PER-QUERY (Linear(d_user, Q*d_model)), not one
    #      shared shift broadcast to all queries.
    # Historical results, kept for reference only:
    # (a) roll, no distill, w=0.3  -> BEST body ever (val g_itc 2.44, g_ii 3.2
    #     @ep17).
    # (b) roll + MF distill, w=0.3 -> body collapsed onto the MF-margin axis
    #     (val g_ii 3.25 -> 0.34).
    # (c) random + distill, w=0.1  -> ii/ui dead at chance on TRAIN, epochs
    #     6-16, never recovered.
    # (d) OFF (w=0.0)              -> ii/ui slow to catch (~ep28 vs ~ep5 for (a)).
    # Standing rule that likely survives the rerun: never give the pretext a
    # learnable low-dim shortcut axis (popularity / MF margin). Read val
    # UIC_acc ~0.5 under "roll" as a metric-ceiling artifact, NOT as failure;
    # user_proj's real training is Stage 3 Step 2 (CTR + align_rank_loss +
    # user-grouped batches).
    w_ui_cond: 0.3
    tau_ui_cond: 0.2
    # Supervise the conditioned BPR with the frozen MF's pairwise ORDER
    # instead of the raw held-in label. Label-fitting through a u x item
    # interaction network memorizes: observed train UIC_acc 0.61 with val
    # pinned at 0.50 and val L_uic drifting above ln 2. MF's dot product is a
    # transferable function of the inputs (held-out uAUC 0.708), so distilling
    # its order forces user_proj to encode a ranking FUNCTION. DISABLED: run
    # (b) above showed the distilled gradient collapses the shared body onto
    # the MF-margin axis — the transferability win is not worth the body.
    ui_cond_distill_mf: False
    # Negative sampling for the conditioned BPR: random | roll. "roll" pits
    # the positive against ANOTHER USER'S positive — popularity-biased items
    # this user plausibly likes too; even the frozen MF only orders that pair
    # type at ~0.55-0.6, so signal and metric ceiling both sat near chance
    # (val UIC_acc 0.505 with distillation confirmed working). "random"
    # catalog negatives give the metric a clean margin BUT hand the body a
    # popularity shortcut axis (run (c) above: ii/ui dead on train). Keep
    # "roll": its gradient is a plain user-item alignment force and the ~0.5
    # val UIC_acc is a known metric-ceiling artifact, not a failure.
    ui_cond_neg: roll
    # L_ii's / L_ui's VOTE in the L_repr selection metric (gradient weights
    # stay w_ii / w_ui). Val L_ii swings ~+-1.2 nats and val L_ui ~+-0.9 nats
    # epoch-to-epoch; at full weight that noise decided every late-epoch
    # selection verdict in the 34-epoch run.
    select_w_ii: 0.3
    select_w_ui: 0.3
    # Checkpoint selection on the CF-ONLY ITC gain from the fixed-n diagnostic
    # (= ln(n) - L_itc with the semantic source forced OFF, so MAXIMISE; 0 is
    # chance). Two earlier candidates both failed, for different reasons:
    #
    # - val_L_repr is a weighted SUM dominated by the raw magnitude of L_ii
    #   (~9.5) and L_ui (~6.2), so it fell steadily (12.91 -> 12.24) straight
    #   through an epoch range where val gain_itc went +0.19 -> -0.23. Blind to
    #   overfitting.
    # - val_gain_itc (sem ON) rewards the SHORTCUT: the semantic bank is
    #   distilled from the very captions ITC targets, so the model can score
    #   well without using CF at all. Measured in one epoch: sem_on val g_itc
    #   +3.010 vs sem_off -0.701 — the CF path had learned nothing while the
    #   metric read "excellent", and the checkpoint was saved.
    #
    # The sem_off variant measures what Stage 3 actually consumes: the CF ->
    # soft-token path. Requires diagnostic_every_epochs: 1 and a val diagnostic
    # loader; Stage 1 validates both at setup. Available keys follow
    # {split}_{sem_on|sem_off}_{gain_itc|gain_llm|L_itc|L_llm|itc_top1|llm_top1|
    # itg_title_acc} — val_sem_off_gain_llm is the alternative worth trying once
    # ITC generalises, since llm_align_proj is what Stage 2 warm-starts from.
    # gain_LLM, not gain_itc. Measured over 5 epochs with the bank withheld from
    # the caption-targeted losses (sem_for_text_losses: False):
    #
    #   ep      1      2      3      4      5
    #   train g_itc  +0.33  +1.18  +2.59  +3.89  +4.54   (rises monotonically)
    #   val   g_itc  +0.16  +0.21  -0.10  -0.41  -0.84   (falls through zero)
    #   val   g_llm  +0.13  +0.20  +0.21  +0.23  +0.25   (rises monotonically)
    #   val   g_ii   +0.12  +0.15  +0.15  +0.15  +0.15
    #   val   UIC_acc 0.513  0.553  0.555  0.557  0.611
    #
    # ITC cannot generalise from CF alone and this is structural, not a tuning
    # problem: its target is the text CLS of "Title: X. Genres: Y", where almost
    # all of the discriminative content is the TITLE — a per-item arbitrary
    # string. MF embeddings are trained on (uid, iid, label), so genres are
    # recoverable (same-genre items co-watch) but titles are not. ITC is
    # 1-of-n retrieval, i.e. identity-level discrimination, so for a held-out
    # item the CF path has nothing to go on and can only memorise train-item
    # signatures. Symptom in the geometry line: offdiag_cos_raw pinned at 0.9998
    # while offdiag_cos_centered SHRINKS (0.0105 -> 0.0050) — a near-constant
    # vector plus a per-item noise signature, which is exactly memorisation.
    #
    # gain_llm is the right target instead: it measures llm_align_proj, the head
    # Stage 2 warm-starts llm_proj from, and its target (the centered
    # input-embedding bank) has shared genre structure that CF really does carry.
    # Keep w_itc > 0 anyway — it still pressures the queries to be
    # input-dependent — just do not let it pick the checkpoint.
    # COMPOSITE, because every single-term metric tried here was blind to a
    # different collapse — each kept improving while something it did not watch
    # fell apart:
    #   val_L_repr            weighted sum of raw losses, dominated by the
    #                         magnitude of L_ii/L_ui; fell steadily while ITC
    #                         overfit.
    #   val_gain_itc          ITC cannot generalise from CF (target is the
    #                         caption text CLS, dominated by per-item TITLE,
    #                         which MF embeddings do not carry): +0.16 -> -0.84
    #                         on val while train went +0.33 -> +4.54.
    #   val_sem_off_gain_llm  generalises and keeps rising to ep46 — but it is
    #                         the only term that does, so it rode straight past
    #                         the collapse of the collaborative terms. Between
    #                         ep16 and ep46 it gained +0.004 while g_ii went
    #                         +0.267 -> -0.015 and g_ui +0.330 -> +0.029.
    #
    # val_gain_repr = gain_llm(sem OFF) + select_collab_weight * (g_ii + g_ui)
    # watches both halves of what the later stages consume: the alignment head
    # Stage 2 warm-starts llm_proj from, and the collaborative signal Stage 3
    # scores with. All three are `gain` values (ln(n) - L) so they are already
    # normalised by their own chance level and can be summed.
    # On the ep1-46 run: peak at ep16 (0.615), ep46 only 0.327.
    selection_metric: val_gain_repr
    selection_mode: max
    # Weight on EACH collaborative gain in the composite. 0.5 keeps the
    # alignment term primary while making the pair jointly comparable to it
    # (g_llm ~0.32 vs 0.5*(0.27+0.33) ~0.30 at the peak).
    select_collab_weight: 0.5
    # Metric the collapse guard watches; defaults to selection_metric so the two
    # cannot disagree about what "healthy" means. Must be a higher-is-better
    # gain_* key for the `< min_collapse_gain` comparison to mean anything.
    collapse_metric: val_gain_repr
    # EMA smoothing of the selection metric before the early stopper (0 = off).
    # Late-training improvements are the same order as the metric's epoch noise,
    # so the raw stopper burns patience on noise plateaus and crowns lucky dips
    # as best-epoch.
    selection_ema: 0.5
    # Single-batch spikes were walking train loss upward late in the run.
    grad_clip_norm: 1.0
    # Batch-centering for the collaborative InfoNCE (L_ii / L_ui). OFF, measured:
    # ON gave L_ii=24.45 against ln(n)=6.41 and L_ui=9.56 vs 5.86 — worse than
    # chance, because the centered residual is near low-rank, the cosines go
    # bipolar, and cross_entropy's logsumexp amplifies that by 1/tau. Turning it
    # off moved g_ii from -18.04 to -4.03 and g_ui from -3.70 to +0.72 in the
    # same epoch. Do NOT also replace the pooling with a max over the Q x Q
    # query grid: that lets max_{q,r} lock onto q == r (cosine ~1 for any pair
    # of inputs) and pins the loss at exactly ln(n).
    pair_logit_center: False
    itc_logit_center: True
    # Batch-centering for the candidate-conditioned BPR. ON — this loss fails
    # the OPPOSITE way to the InfoNCE above, which is why it needs its own flag.
    # softplus sees only s_neg - s_pos, so there is no logsumexp to blow up; the
    # problem is that the query output is nearly collinear across inputs
    # (measured offdiag_cos_raw ~0.9999), so both scores sit at ~1.0 where the
    # cosine is saturated, the difference is ~0, and user_proj gets no gradient.
    # Symptom: L_uic pinned at exactly ln 2 = 0.6931 with user_proj still at its
    # zero init. Watch the [DIAG] "zero-init paths" line to confirm it moves.
    bpr_logit_center: True
    decoupled_weight_decay: True
    # Collapse threshold for collapse_metric (any gain_* key; 0.0 = chance).
    # 0.05 against val_sem_off_gain_llm, which sat at 0.13-0.27 and rising over
    # the last run — so this only fires if the LLM alignment genuinely stops
    # beating chance, not merely because ITC memorises. Old key name
    # `min_gain_itc` is still read as a fallback.
    min_collapse_gain: 0.05
    collapse_patience: 3
    collapse_warmup_epochs: 3
    # SeLLa alignment: gradients flow through the injection-identical
    # llm_align_proj (Linear+LayerNorm on out_proj output, per token, pooled
    # after projection). The head is exported and warm-starts Stage-2's
    # llm_proj — see best_align_proj_weights_name / run.qformer_stage2.proj_ckpt_in.
    w_llm: 1.0
    tau_itc: 0.07
    tau_ii: 0.07
    tau_ui: 0.07
    # Softer than the other contrastives: even after centering, input-space
    # targets keep residual correlation (shared genres), and tau=0.07 was
    # too sharp — LLM@1 sat at chance (~0.003) while ITC@1 learned.
    tau_llm: 0.20
    # How the frozen item_llm_emb targets are conditioned before the cosine
    # InfoNCE: none | center | whiten. center, NOT whiten: whitening rescales
    # each dimension, so the aligned geometry no longer matches the raw LLM
    # input-embedding coordinate system that Stage 3 injects into. The old
    # capacity argument for whiten (L_llm plateaued under center) predates the
    # switch of loss_llm_align from mean-pooled queries to BLIP-2 query
    # selection, which attacks the same plateau without bending the target
    # space. Revisit whiten only if L_llm still cannot fit TRAIN targets.
    llm_emb_normalize: center
    # Mirror of model.qformer_config.user_conditioned: builds user_proj in the
    # Stage-1 adapter and pretrains it via the candidate-conditioned (DIN-style)
    # user-item BPR, so it does not reach Stage 3 at its zero init.
    user_conditioned: ${model.qformer_config.user_conditioned}
    # Semantic second cross-attention source (reuses item_llm_emb_path below).
    sem_source: ${model.qformer_config.sem_source}
    sem_source_dropout: ${model.qformer_config.sem_source_dropout}
    # Should the semantic bank also feed ITC / ITM / ITG / L_llm? NO.
    # For those four the target derives from the item caption, and the bank is
    # the frozen LLM's own reading of that same caption (3584 dims, mean norm
    # ~289) next to a 256-dim MF vector — so it is the answer, not side
    # information, and copying it is strictly cheaper than learning from CF.
    # Measured at epoch 1 with the bank fed everywhere:
    #     val g_itc  sem_on +2.878  vs  sem_off -0.797
    #     val g_llm  sem_on +1.051  vs  sem_off +0.013  (LLM@1 sem_off = 0.0000)
    # The CF path was BELOW chance while the headline numbers looked strong.
    # sem_source_dropout only changes how OFTEN the shortcut is available, not
    # that it wins where it is; withholding it from these four removes it.
    # The collaborative terms (L_ii / L_ui) keep the bank — their targets are
    # co-watch / interaction CF, so there it is genuinely auxiliary, and that is
    # what keeps proj_sem trained for Stage 3.
    # Side effect: the [DIAG] sem_on and sem_off item_text lines become identical
    # by construction. That is the expected signature, not a bug — if they ever
    # differ, the bank has leaked back into a text loss.
    sem_for_text_losses: False
    # L_llm TARGET bank. Must be distilled with --space input (LLM
    # input-embedding space — the space soft tokens are injected into). The
    # last-hidden file stays on model.qformer_config.item_llm_emb_path for the
    # warm token.
    item_llm_emb_path: "/content/SigLLM/data/processed/ml-1m/item_llm_emb_input.pt"
    # Semantic cross-attention SOURCE bank (proj_sem input). MUST differ from
    # item_llm_emb_path above: source == target lets the model solve L_llm by
    # copying the source through proj_sem -> out_proj -> llm_align_proj (and
    # val runs without sem dropout, so the val number was a 100% leak). The
    # trainer hard-errors if the two paths coincide while w_llm > 0. Uses the
    # LAST-HIDDEN bank — a different geometry of the same captions.
    item_sem_emb_path: "/content/SigLLM/data/processed/ml-1m/item_llm_emb.pt"
    weight_decay: 1e-3
    debug_batch: True
    debug_batch_max_steps: 10
    early_stopping_patience: 10
    early_stopping_min_delta: 1e-4
    best_checkpoint_name: "qformer_stage1_best_full.pt"
    best_qformer_weights_name: "qformer_stage1_best_qformer.pth"
    best_align_proj_weights_name: "qformer_stage1_best_align_proj.pth"
    log_epoch: 1
    # 30, down from 100. The useful region ends around ep16-20: val_gain_repr
    # peaked at ep16 on the last run and every later epoch traded collaborative
    # signal for a few thousandths of gain_llm. 30 leaves room for early stopping
    # (patience 10) to fire on its own after a ~ep16-20 peak rather than being
    # cut off by the cap.
    epoch: 30
    pretrained_rec_path: ${model.rec_config.pretrained_path}
    freeze_rec: True
    output_dir: "/content/SigLLM/ckpt/qformer_stage1/"

  qformer_stage2:
    # BLIP-2-style generative pretraining: train Q-Former + linear projection
    # on next-token LM of item-text captions with the LLM fully frozen (no LoRA).
    seed: 2025
    batch_size: 32
    num_workers: 4
    embedding_size: ${model.rec_config.embedding_size}
    user_num: ${model.rec_config.user_num}
    item_num: ${model.rec_config.item_num}
    num_queries: ${model.qformer_config.num_queries}
    num_heads: ${model.qformer_config.num_heads}
    num_layers: ${model.qformer_config.num_layers}
    qformer_d_model: ${model.qformer_config.qformer_d_model}
    qformer_output_dim: ${model.qformer_config.qformer_output_dim}
    qformer_text_model_name: ${model.qformer_config.qformer_text_model_name}
    max_instruction_length: ${model.qformer_config.max_instruction_length}
    llm_model_name: ${model.llm_model}
    pretrained_rec_path: ${model.rec_config.pretrained_path}
    qformer_ckpt_in: "${run.qformer_stage1.output_dir}${run.qformer_stage1.best_qformer_weights_name}"
    # Warm-start llm_proj from Stage 1's aligned projection instead of a fresh
    # init — this is what carries the SeLLa alignment into the injection path.
    proj_ckpt_in: "${run.qformer_stage1.output_dir}${run.qformer_stage1.best_align_proj_weights_name}"
    # Input-space alignment keep-alive: OFF. It pulls llm_proj toward the
    # (normalized) input-embedding bank geometry while w_align below pulls the
    # SAME vectors toward the LLM's last-hidden caption space — two different
    # coordinate systems fighting over one projection. The Stage-1 alignment
    # already rides in via the warm-started proj_ckpt_in; w_align alone keeps
    # the injected tokens grounded in the space the LLM actually reads.
    w_llm: 0.0
    tau_llm: ${run.qformer_stage1.tau_llm}
    # Discriminative LLM-space alignment (the load-bearing Q-Former→LLM
    # grounding): on-the-fly symmetric InfoNCE between mean-pooled
    # llm_proj(soft tokens) — the EXACT vectors Stage 3 injects — and the
    # frozen base LLM's last-hidden representation of the same captions.
    # Unlike w_llm (input-space distilled targets, keep-alive), this aligns
    # to the space the LLM reads at inference, so the frozen LLM can
    # discriminate items from soft tokens alone. Tune 0.5–2.0; 0.0 = exact
    # legacy behavior (no extra LLM forward).
    w_align: 1.0
    tau_align: 0.07
    # Conditioning for the PRECOMPUTED w_align caption-target bank
    # (none | center | whiten). Raw Qwen2 last-hidden states share massive
    # activations (target norms ~277, all captions near-collinear), which
    # pinned llm_align at ln(batch)=3.466 with align@1 at exact chance and
    # pos_sim == neg_sim for 20 straight epochs — zero gradient. This space is
    # only a discrimination reference (never read back by the LLM), so
    # whitening it is safe, unlike llm_emb_normalize above.
    align_target_normalize: whiten
    # Adam + fp16 with no clipping blew up at epoch 18 (lm 0.76 -> 1.88,
    # soft_norm 0.54 -> 0.99, never recovered). 0 disables.
    grad_clip_norm: 1.0
    # Must stay tied to Stage 1: the keep-alive and the warm-started llm_proj
    # have to reference the same target geometry.
    llm_emb_normalize: ${run.qformer_stage1.llm_emb_normalize}
    item_llm_emb_path: ${run.qformer_stage1.item_llm_emb_path}
    # Adapter shape must mirror Stage 1 (user_proj + proj_sem ride through the
    # strict checkpoint load to Stage 3), and the semantic source stays active
    # so the generative objective trains the same two-source attention.
    user_conditioned: ${model.qformer_config.user_conditioned}
    sem_source: ${model.qformer_config.sem_source}
    # Semantic SOURCE bank — same file Stage 1 trained proj_sem on (last-
    # hidden), distinct from the item_llm_emb_path target bank above.
    item_sem_emb_path: ${run.qformer_stage1.item_sem_emb_path}
    sem_source_dropout: ${model.qformer_config.sem_source_dropout}
    # ui keep-alive: the generative objective is 100% S=1 forwards, so a full
    # Stage 2 run washes out the multi-source history pooling and candidate
    # conditioning (user_proj) Stage 1 just pretrained for Stage 3's
    # <UserProfile>. Replay one user_item batch (Stage-1 InfoNCE + conditioned
    # BPR, same hyperparameters) per generative step. 0.0 = legacy behaviour.
    w_ui_keep: 0.3
    tau_ui_keep: ${run.qformer_stage1.tau_ui}
    w_ui_cond_keep: ${run.qformer_stage1.w_ui_cond}
    tau_ui_cond: ${run.qformer_stage1.tau_ui_cond}
    ui_cond_neg: ${run.qformer_stage1.ui_cond_neg}
    # Must match Stage 1 — the keep-alive replays the same loss.
    pair_logit_center: ${run.qformer_stage1.pair_logit_center}
    bpr_logit_center: ${run.qformer_stage1.bpr_logit_center}
    itc_logit_center: ${run.qformer_stage1.itc_logit_center}
    qformer_ckpt_out: "qformer_stage2_best_qformer.pth"
    proj_ckpt_out: "qformer_stage2_best_proj.pth"
    output_dir: "/content/SigLLM/ckpt/qformer_stage2_qwen2/"
    lr: 1e-4
    weight_decay: 1e-3
    # 40, not 20: the 20-epoch run was still improving when the cap hit (best
    # at 17, patience never fired), and the align loss — once its targets are
    # fixed — learns slower than the LM term. Early stopping is the real
    # budget; this is just headroom.
    epoch: 40
    log_epoch: 1
    # Step-level progress log every N batches (running means incl. llm_align,
    # align@1/@5, pos/neg cosine and sim_gap). 0 = epoch summaries only.
    log_steps: 50
    max_caption_length: 64
    early_stopping_patience: 5
    early_stopping_min_delta: 1e-4

  qformer_stage3_step1:
    # CoLLM Step 1 — train LoRA with Q-Former + projection FROZEN (they are
    # unfrozen in Step 2). Only Step 1-specific overrides live here —
    # everything else (optimizer schedule, warmup, batch sizes) is inherited
    # from the top-level `run.*` defaults.
    #
    # HISTORY-SOFT-ONLY prompt: same as the full one but with <ItemTitleList>
    # removed, so <UserProfile> is the ONLY route by which the user's history
    # reaches the LLM.
    #
    # History of this key, because it has now been wrong in two different ways:
    #   text_only        (CoLLM original) — no soft-token slots at all. LoRA
    #                    learned to answer from titles; Step 2 then froze LoRA
    #                    and could only rewrite a channel the adapted model had
    #                    learned to ignore. Flat Step-2 uAUC.
    #   full             (previous setting) — meant to fix that by showing LoRA
    #                    the channel from step 0. It did not: the full prompt
    #                    carries the history TWICE, as <UserProfile> soft tokens
    #                    and as <ItemTitleList> text. They are redundant and the
    #                    text path is the one Qwen2 understands from pretraining,
    #                    so LoRA still had no reason to read the soft tokens.
    #                    It also made Step 1 and Step 2 nearly identical — same
    #                    prompt, same data, same loss, differing only in which
    #                    block is trainable, i.e. block coordinate descent rather
    #                    than a curriculum.
    #   no_hist_text     (current) — removes the shortcut instead of hoping the
    #                    model ignores it, the same fix that worked for the
    #                    Stage-1 semantic-bank shortcut. <TargetItemTitle> is
    #                    deliberately KEPT so only the history channel changes.
    #
    # Step 2 keeps the FULL prompt, so the two steps now differ in input as well
    # as in trainable block: Step 1 makes LoRA read the channel, Step 2 adds the
    # text back and refines what is written into the channel.
    #
    # Expect Step 1 uAUC to be interpretable either way: up means redundancy was
    # the blocker; a large drop means the soft tokens cannot yet substitute for
    # the titles, which points back at Stage 1/2 quality rather than the prompt.
    # Revert with --options run.qformer_stage3_step1.prompt_path=<full prompt>.
    prompt_path: "/content/SigLLM/prompts/qformer_prompt_movie_no_hist_text.txt"
    output_dir: "/content/SigLLM/ckpt/qformer_stage3_step1_lora_qwen2/"
    best_ckpt_name: "checkpoint_best.pth"
    init_lr: 8e-5
    # Must be overridden together with init_lr (same trap as step 2): the
    # top-level min_lr (8e-5) EQUALS this init_lr, so the inherited cosine
    # schedule was a flat line — no decay across the 5 epochs.
    min_lr: 8e-6
    max_epoch: 5

  qformer_stage3_step2:
    # CoLLM Step 2 — train Q-Former + projection on the full prompt, LoRA
    # loaded frozen from the Step 1 best checkpoint. Symmetric in shape to
    # `qformer_stage3_step1`: only the keys that differ from the top-level
    # defaults are listed here.
    #
    # direct_id prompt: full prompt + the SeLLa <UserID>/<ItemID> single-token
    # slots (see model.direct_id_tokens). Revert to qformer_prompt_movie.txt
    # to run without the direct path.
    prompt_path: "/content/SigLLM/prompts/qformer_prompt_movie_direct_id.txt"
    output_dir: "/content/SigLLM/ckpt/qformer_stage3_step2_cie_qwen2/"
    ckpt: "${run.qformer_stage3_step1.output_dir}${run.qformer_stage3_step1.best_ckpt_name}"
    init_lr: 3e-5
    # Must stay below init_lr: the top-level min_lr (8e-5) is ABOVE this stage's
    # init_lr (3e-5), which INVERTED the cosine schedule — LR climbed 3e-5 → 8e-5
    # over training instead of decaying. That is the mechanism behind the
    # user-conditioned trajectory (val peaks ~epoch 3, then declines as LR rises).
    min_lr: 3e-6
    max_epoch: 200
    # SeLLa trains the CF embeddings JOINTLY at its final step; CoLLM's step 2
    # froze them. false = MF trainable in its own optimizer param group.
    # rec_lr_scale 3.33 * init_lr 3e-5 ~= 1e-4 for the embeddings while the
    # Q-Former moves at 3e-5. NOTE this is deliberately faster than the step-3
    # guidance (0.05): the semantically-aligned MF (rec_baseline alignment)
    # is anchored to the LLM space, so it can afford to move — but watch the
    # "MF drift" log line; rising drift with flat val uAUC means lower this.
    freeze_rec: false
    rec_lr_scale: 3.33
    rec_weight_decay: 1e-4

  qformer_stage3_step3:
    # JOINT tuning — MF + Q-Former + projection + LoRA all trainable, base LLM
    # frozen. Steps 1 and 2 each freeze what the other trains, so neither lets
    # the CF encoder co-adapt with the channel that reads it; this step does.
    # Run it AFTER step 1 (and optionally step 2), never instead of them.
    prompt_path: "/content/SigLLM/prompts/qformer_prompt_movie.txt"
    output_dir: "/content/SigLLM/ckpt/qformer_stage3_step3_joint_qwen2/"
    best_ckpt_name: "checkpoint_best.pth"
    # Which checkpoint to warm-start from: step1 | step2.
    # step1 (default): LoRA already knows how to READ the soft-token channel,
    # while Q-Former/projection come from Stage 2. step2: also inherits the
    # step-2-adapted Q-Former/projection. Do NOT start cold — with everything
    # trainable and the channel still noisy, LoRA learns to answer from prompt
    # text alone and the soft tokens never earn their weight.
    ckpt_from: step1
    # Does MF join the joint set? These are two INDEPENDENT questions and mixing
    # them makes a uAUC change unattributable:
    #   true  -> LoRA + Q-Former + projection co-adapt, MF held FIXED. Tests
    #            whether splitting Stage 3 into two frozen-alternating steps is
    #            what caused the flat Step-2 uAUC, without disturbing the MF
    #            geometry that Stage 1/2 aligned against.
    #   false -> the above plus MF (the original joint intent). Needs
    #            rec_lr_scale and the mf_drift diagnostic.
    # Start with true; only add MF once co-adaptation alone has a number.
    freeze_rec: true
    # Below step 2's 3e-5: four module groups now move at once (LoRA + Q-Former
    # + projection + MF), so the same per-module step size compounds into a
    # much larger change in the composed function.
    init_lr: 1e-5
    # Must be set together with init_lr — the top-level min_lr (8e-5) is far
    # ABOVE this, which would invert the cosine schedule into a climb. Same
    # trap as steps 1 and 2.
    min_lr: 1e-6
    max_epoch: 50
    # MF learning rate = init_lr * rec_lr_scale (its own optimizer param group;
    # see build_optimizer and the lr_scale handling in common/optims.py, since
    # the schedulers overwrite every group's lr on every step).
    #
    # 0.05 -> effective 5e-7. MF must move MUCH slower than the modules reading
    # it: Stage 1/2 aligned the Q-Former against a FIXED MF geometry, so a
    # fast-moving MF invalidates that alignment faster than the Q-Former can
    # track it — the same class of failure as A/B run (b), where a low-dim
    # gradient axis collapsed the shared body (val g_ii 3.25 -> 0.34). With
    # 839 users / 3256 items / ~33k samples, MF also memorizes quickly under a
    # per-user BPR. Watch the "MF drift" log line: rising drift with flat or
    # falling val uAUC means lower this; drift ~0 means MF is effectively frozen
    # and this step is only step 2 plus LoRA.
    rec_lr_scale: 0.05
    # 1e-4, matching what the MF baseline was trained with
    # (run.rec_baseline.wd). The generic optimizer rule files any 2-D tensor
    # under the global weight_decay (1e-3), which is 10x too strong for
    # embedding tables — there decay drags rows that a batch never visits
    # toward zero.
    rec_weight_decay: 1e-4

  sella_gated_step1:
    # SeLLa's step 1 = TALLRec: a LoRA SFT with NO collaborative signal. The
    # collaborative side enters for the first time in sella_gated_step3, with
    # this LoRA loaded and FROZEN.
    #
    # This block exists separately from qformer_stage3_step1 for two reasons:
    #   1. that script loads model.qformer_config.qformer_ckpt /
    #      llm_proj_ckpt unconditionally, and those are qformer_stage2 outputs
    #      which this branch never produces (FileNotFoundError at build time);
    #   2. its prompt (no_hist_text) carries <UserProfile>/<TargetItemID>, so
    #      with no stage-2 checkpoint LoRA would train against a Q-Former that
    #      is random AND frozen.
    # train_sella_gated_step1_lora.py sets both ckpts to "not_have" and hard-
    # errors if the prompt is not text-only.
    #
    # Separate output_dir so nhánh A's step 1 (if it is also run) is untouched.
    prompt_path: "/content/SigLLM/prompts/qformer_prompt_movie_text_only.txt"
    output_dir: "/content/SigLLM/ckpt/sella_gated_step1_lora_qwen2/"
    best_ckpt_name: "checkpoint_best.pth"
    init_lr: 8e-5
    # Must be below init_lr: the top-level min_lr (8e-5) EQUALS this init_lr,
    # which flattens the cosine schedule into a constant.
    min_lr: 8e-6
    max_epoch: 5

  sella_gated_step3:
    # The ONLY training stage of the gated-Q-Former variant (arch:
    # sella_gated_rec_llm). Stage 1 (InfoNCE) and Stage 2 (generative) are NOT
    # run: with ~4.3M parameters behind a zero-init gate there is nothing for a
    # representation-pretraining stage to protect, and both stages were carrying
    # a documented failure (Stage 1's gain near chance, Stage 2 drowned out by
    # the <ItemTitleList> text path).
    #
    # Prerequisites: distill (last_hidden bank) -> MF with the Step-2 alignment
    # -> qformer_stage3_step1_lora -> this.
    prompt_path: "/content/SigLLM/prompts/sella_gated_movie.txt"
    output_dir: "/content/SigLLM/ckpt/sella_gated_step3_qwen2/"
    best_ckpt_name: "checkpoint_best.pth"

    # Which LoRA to start from:
    #   sella_step1  run.sella_gated_step1 — SeLLa's arrangement (text-only
    #                TALLRec LoRA). THE DEFAULT.
    #   step1|step2  nhánh A's qformer_stage3_step{1,2} checkpoints, for
    #                comparing against a LoRA that was adapted with the
    #                soft-token channel present.
    #   self         resume this stage (also what eval-only runs want).
    #   none         cold LoRA — an explicitly different experiment.
    ckpt_from: sella_step1

    # Where LoRA comes from when ckpt_from=self.
    #
    # This stage FREEZES LoRA, and RunnerBase._save_checkpoint drops every
    # requires_grad=False tensor — so a checkpoint written by this stage contains
    # the collaborative modules and NO lora_* keys. Resuming / eval-only /
    # ablate-at-inference (all ckpt_from=self) would therefore leave lora_B at
    # its zero-init, making the adapter the identity and quietly scoring the
    # unadapted base LLM. Same set of values as ckpt_from; only read when
    # ckpt_from=self.
    #
    # The model RAISES if LoRA is frozen and nothing supplied it, unless
    # ckpt_from=none (which sets allow_cold_lora). A cold frozen LoRA is the one
    # failure here that costs nothing at build time and only shows up as worse
    # numbers, so it is an error, not a warning.
    lora_from: sella_step1

    # MF joins the trainable set, as SeLLa does at its final step, in its own
    # optimizer param group. rec_lr_scale 3.33 * init_lr 3e-5 ~= 1e-4 for the
    # embeddings — same setting as qformer_stage3_step2, which is where the
    # comparable number comes from. Watch the "MF drift" log line: rising drift
    # with flat val uAUC means lower this. Set true to hold MF fixed and isolate
    # the Q-Former's contribution alone.
    freeze_rec: false
    rec_lr_scale: 3.33
    rec_weight_decay: 1e-4

    init_lr: 3e-5
    # Must be set together with init_lr — the top-level min_lr (8e-5) is ABOVE
    # this, which would invert the cosine schedule into a climb.
    min_lr: 3e-6
    max_epoch: 30

    # SMALLER than the top-level 16, and that is about the loss, not the model.
    # SeLLa's objective is full-vocabulary LM cross-entropy over the whole
    # sequence, where QRecLLM's touched ONE position. With Qwen2's 151936-token
    # vocab, the fp32 logits for the supervised positions cost ~0.6 MB per
    # PROMPT TOKEN per sample, plus as much again inside cross_entropy. At
    # datasets.movie_ood.max_history_length=10 (SeLLa's cap) the prompt runs
    # ~86-120 tokens, so only ~0.1-0.15 GB/sample transient — batch 8 costs
    # ~1 GB, and batch 16-32 is comfortable if you want the throughput (halve
    # iters_per_epoch to keep samples/epoch comparable).
    # This term scales LINEARLY in prompt length, so if you raise the history
    # cap, re-check it: at cap 50 the same batch costs ~4x more.
    #
    # If it still OOMs, in order of preference:
    #   1. model.sella_gated.lm_loss_scope=answer  (supervises 1 position per
    #      sample; the memory term all but disappears)
    #   2. lower this
    #   3. lower datasets.movie_ood.max_history_length (shortens the prompt)
    batch_size_train: 8
    batch_size_eval: 16
    # Doubled from the top-level 400 so samples-per-epoch stays at 6400 despite
    # the halved batch — keeps "epoch" comparable to the other stages' logs.
    iters_per_epoch: 800

  # Optimization
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 8e-5
  warmup_lr: 1e-5
  weight_decay: 1e-3
  amp: True
  # Global grad-norm clip for the Stage-3 loop (steps 1/2/3). Stage 1/2 already
  # clip at 1.0 and both document that Adam + fp16 with NO clipping blows the
  # run up mid-training and never recovers; the Stage-3 loop had no clip at all,
  # which matches the observed divergence (train loss climbs past ln 2, val AUC
  # oscillates below 0.5). 0 disables.
  grad_clip_norm: 1.0
  # MF optimizer group defaults. Only take effect when MF is trainable, i.e.
  # tuning_step=3; steps 1/2 filter it out via requires_grad and the optimizer
  # builds the same two groups as before. The step-3 block overrides both.
  rec_lr_scale: 1.0
  rec_weight_decay: 1e-4
  
  # Training Schedule
  max_epoch: 200
  iters_per_epoch: 400
  batch_size_train: 16
  batch_size_eval: 64
  num_workers: 4
  warmup_steps: 200

  # User-grouped batching for the per-user pairwise (uAUC) losses above. When
  # enabled, the train loader reorders samples so each batch holds
  # `items_per_user` interactions per user with mixed labels -> many same-user
  # (pos,neg) pairs for ranking_loss / align_rank_loss to act on.
  # enabled=false -> original random/distributed sampling (no behavior change).
  # Only affects map-style rec datasets (Stage 3); Stage 1/2 use their own loader.
  # ON: required for ranking_loss / align_rank_loss above — with random
  # batching, same-user (pos, neg) pairs are rare and both BPR terms silently
  # return 0 on most batches.
  user_grouped_batch:
    enabled: true
    items_per_user: 8
    seed: 0

  # Workflow
  evaluate: False
  mode: "v2"
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "test_warm", "test_cold"]
  resume_ckpt_path: null

  # Distributed
  distributed: True
  world_size: 1
  dist_url: "env://"
